name: Run Tests

on:
  push:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: python -m pytest

      - name: Build Docker Image
        run: docker build -t repo-sandbox .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: |
          docker tag repo-sandbox ghcr.io/rodolphenkerbu/repo-sandbox:latest
          docker push ghcr.io/rodolphenkerbu/repo-sandbox:latest
